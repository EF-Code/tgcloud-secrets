services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      # INSECURE EXAMPLE - use POSTGRES_PASSWORD_FILE or env interpolation in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tgcloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: local KMS mock via LocalStack for AWS KMS testing
  # localstack:
  #   image: localstack/localstack:latest
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     - SERVICES=kms
  #     - DEFAULT_REGION=us-east-1
  #   volumes:
  #     - localstack:/tmp/localstack

volumes:
  pgdata:
